x-app: &app
  build: .
  image: orders-stream:local
  environment: &app-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    KAFKA_TOPIC: orders
    KAFKA_DLQ_TOPIC: orders.dlq
    PG_HOST: postgres
    PG_DB: streaming
    PG_USER: ${POSTGRES_USER:-postgres}
    PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in orders orders.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done
    restart: "no"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: streaming
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 10

  spark-job:
    <<: *app
    command: ["python", "-m", "orders_stream.job"]
    environment:
      <<: *app-env
      STREAM_WINDOW: ${STREAM_WINDOW:-1 minute}
      STREAM_WATERMARK: ${STREAM_WATERMARK:-10 minutes}
      STREAM_TRIGGER: ${STREAM_TRIGGER:-10 seconds}
      CHECKPOINT_DIR: /data/checkpoints
      ARCHIVE_DIR: /data/archive/orders
    volumes:
      - ./data:/data
    ports:
      - "4040:4040"  # Spark UI
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  producer:
    <<: *app
    command: ["python", "-m", "orders_stream.producer"]
    environment:
      <<: *app-env
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-20}
      LATE_RATIO: ${LATE_RATIO:-0.05}
      VERY_LATE_RATIO: ${VERY_LATE_RATIO:-0.01}
      INVALID_RATIO: ${INVALID_RATIO:-0.02}
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/orders-realtime.json
      PG_USER: ${POSTGRES_USER:-postgres}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
