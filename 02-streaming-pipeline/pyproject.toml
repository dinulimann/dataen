[project]
name = "orders-stream"
version = "0.1.0"
description = "Streaming pipeline: Kafka -> Spark Structured Streaming -> Postgres -> Grafana"
requires-python = ">=3.11"
dependencies = [
    "pyspark==4.0.1",
    "confluent-kafka>=2.5",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
