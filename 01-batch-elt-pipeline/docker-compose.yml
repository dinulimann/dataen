x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    PYTHONPATH: /opt/airflow/src
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    CITIES_CSV: /opt/dbt/seeds/cities.csv
    LAKE_ENDPOINT_URL: http://minio:9000
    LAKE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    LAKE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    LAKE_BUCKET: raw
    WAREHOUSE_HOST: postgres
    WAREHOUSE_PORT: "5432"
    WAREHOUSE_DB: warehouse
    WAREHOUSE_USER: ${POSTGRES_USER:-postgres}
    WAREHOUSE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # --- Orkestrasi lintas proyek ---
    # Lakehouse (proyek 03): dijalankan sebagai container lewat docker-socket-proxy.
    DOCKER_URL: tcp://docker-proxy:2375
    LAKEHOUSE_IMAGE: taxi-lakehouse:local
    LAKEHOUSE_HOST_PATH: ${LAKEHOUSE_HOST_PATH:-}
    LAKEHOUSE_LAG_MONTHS: "2"
    # Streaming (proyek 02): Postgres-nya diakses lewat port host 5433.
    STREAMING_PG_HOST: host.docker.internal
    STREAMING_PG_PORT: "5433"
    STREAMING_PG_DB: streaming
    STREAMING_PG_USER: ${STREAMING_PG_USER:-postgres}
    STREAMING_PG_PASSWORD: ${STREAMING_PG_PASSWORD:-postgres}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./dbt:/opt/dbt
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-warehouse.sql:/docker-entrypoint-initdb.d/init-warehouse.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 10

  # Akses terbatas ke Docker API untuk DockerOperator, tanpa memberi Airflow
  # socket Docker secara langsung (dan tanpa urusan izin grup docker).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      # Tanpa ini haproxy gagal start di Docker yang IPv6-nya nonaktif.
      DISABLE_IPV6: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create --role Admin \
          --username "${AIRFLOW_ADMIN_USER:-admin}" --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Data --lastname Engineer --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started

  # Opsional: jalankan dengan `docker compose --profile bi up -d`
  metabase:
    image: metabase/metabase:latest
    profiles: ["bi"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
