[project]
name = "taxi-lakehouse"
version = "0.1.0"
description = "Lakehouse NYC Taxi: medallion architecture with PySpark + Delta Lake"
requires-python = ">=3.11"
dependencies = [
    "pyspark==4.0.1",
    "delta-spark==4.0.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
