name: 02 - Streaming CI

on:
  push:
    paths: ["02-streaming-pipeline/**", ".github/workflows/streaming-ci.yml"]
  pull_request:
    paths: ["02-streaming-pipeline/**", ".github/workflows/streaming-ci.yml"]

defaults:
  run:
    working-directory: 02-streaming-pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Unit tests (Spark lokal)
        run: pytest -q
